<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Rays - Job Seekers Registration Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="form-container">
        <!-- STEP 1: FORM TITLE -->
        <header>
            <h1>STAR RAYS OUTSOURCING</h1>
            <h2>JOB SEEKERS REGISTRATION FORM</h2>
            <p class="tagline">Helping Businesses Hire Right</p>
            <p class="instruction">Please complete this form accurately to enable us to consider you for suitable job opportunities.</p>
        </header>

        <!-- Replace YOUR_FORM_ID with your Formspree/Web3Forms endpoint -->
        <form id="applicantForm" action="https://formspree.io/f/YOUR_FORM_ID" method="POST" enctype="multipart/form-data">
            
            <!-- STEP 2: PERSONAL INFORMATION -->
            <fieldset>
                <legend>Personal Information</legend>
                
                <label>1. Full Name *</label>
                <input type="text" name="Full_Name" required>

                <label>2. Age *</label>
                <input type="number" name="Age" min="18" max="70" required>

                <label>3. Gender *</label>
                <select name="Gender" required>
                    <option value="">-- Select Gender --</option>
                    <option value="Female">Female</option>
                    <option value="Male">Male</option>
                </select>

                <label>4. Phone Number *</label>
                <input type="tel" name="Phone_Number" required>

                <label>5. WhatsApp Number *</label>
                <input type="tel" name="WhatsApp_Number" required>

                <label>6. Current Residential Address *</label>
                <input type="text" name="Address" required>

                <label>7. City / Location *</label>
                <input type="text" name="City" required>

                <label>8. State of Origin *</label>
                <input type="text" name="State_of_Origin" required>

                <label>9. Highest Educational Qualification *</label>
                <select name="Qualification" required>
                    <option value="">-- Select Qualification --</option>
                    <option value="FSLC">Primary / FSLC</option>
                    <option value="SSCE/WAEC/NECO">SSCE / WAEC / NECO</option>
                    <option value="OND/NCE">OND / NCE</option>
                    <option value="HND/BSc">HND / B.Sc</option>
                    <option value="Postgraduate">Postgraduate</option>
                </select>

                <label>10. Marital Status *</label>
                <select name="Marital_Status" required>
                    <option value="">-- Select Status --</option>
                    <option value="Single">Single</option>
                    <option value="Married">Married</option>
                    <option value="Divorced">Divorced</option>
                    <option value="Widowed">Widowed</option>
                </select>

                <label>11. Number of Children *</label>
                <input type="number" name="Number_of_Children" min="0" required>

                <label>12. Tribe *</label>
                <input type="text" name="Tribe" required>

                <label>13. Religion (if relevant to placement)</label>
                <input type="text" name="Religion">

                <label>14. Next of Kin's Full Name *</label>
                <input type="text" name="Next_of_Kin_Name" required>

                <label>15. Next of Kin's Phone Number *</label>
                <input type="tel" name="Next_of_Kin_Phone" required>

                <label>16. Next of Kin's Address *</label>
                <input type="text" name="Next_of_Kin_Address" required>

                <label>17. Passport Photograph / Full Picture * (JPG, JPEG, PNG)</label>
                <input type="file" name="Full_Picture" accept=".jpg, .jpeg, .png" required>
            </fieldset>

            <!-- STEP 3: JOB PREFERENCE -->
            <fieldset>
                <legend>Job Preference</legend>
                <label>What type of job are you looking for? *</label>
                <select id="jobPosition" name="Job_Position" required onchange="toggleJobQuestions()">
                    <option value="">-- Select Position --</option>
                    <option value="Live-in House Help">Live-in House Help</option>
                    <option value="Live-out House Help">Live-out House Help</option>
                    <option value="Live-in Nanny">Live-in Nanny</option>
                    <option value="Live-out Nanny">Live-out Nanny</option>
                    <option value="Cleaner">Cleaner</option>
                    <option value="Administrative Assistant">Administrative Assistant</option>
                    <option value="Receptionist/Front Desk Officer">Receptionist / Front Desk Officer</option>
                    <option value="Customer Service Representative">Customer Service Representative</option>
                    <option value="Office Assistant">Office Assistant</option>
                    <option value="Personal Assistant/Secretary">Personal Assistant / Secretary</option>
                    <option value="HR Assistant">HR Assistant</option>
                    <option value="Accounts Assistant">Accounts Assistant</option>
                    <option value="Procurement Officer">Procurement Officer</option>
                    <option value="Other">Other</option>
                </select>
            </fieldset>

            <!-- STEP 4: DOMESTIC STAFF QUESTIONS -->
            <fieldset id="domesticSection" class="hidden-section">
                <legend>Domestic Staff Details</legend>
                
                <label>1. How many years of experience do you have? *</label>
                <input type="number" name="Domestic_Experience_Years">

                <label>2. Name of last employer *</label>
                <input type="text" name="Domestic_Last_Employer">

                <label>3. Address/location of last employer *</label>
                <input type="text" name="Domestic_Employer_Address">

                <label>4. Phone number of last employer *</label>
                <input type="tel" name="Domestic_Employer_Phone">

                <label>5. What were your duties in your previous employment? *</label>
                <textarea name="Domestic_Duties" rows="3"></textarea>

                <label>6. Why did you leave your last job? *</label>
                <textarea name="Domestic_Reason_Leaving" rows="2"></textarea>

                <label>7. Do you have experience caring for children? *</label>
                <select name="Domestic_Child_Care_Experience">
                    <option value="">-- Select --</option>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>

                <label>8. Are you comfortable working in a home with children? *</label>
                <select name="Domestic_Comfortable_With_Children">
                    <option value="">-- Select --</option>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>

                <label>9. Are you willing to follow employer's instructions and rules? *</label>
                <select name="Domestic_Follow_Rules">
                    <option value="">-- Select --</option>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>

                <label>10. Are you willing to undergo guarantor verification? *</label>
                <select name="Domestic_Guarantor_Verification">
                    <option value="">-- Select --</option>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>

                <label>11. Expected monthly salary *</label>
                <input type="text" name="Domestic_Expected_Salary">

                <label>12. When can you resume work? *</label>
                <input type="text" name="Domestic_Resumption_Date">

                <label>13. Do you have any allergies we should know about?</label>
                <input type="text" name="Domestic_Allergies">

                <label>14. Do you have an ulcer or dietary needs affecting work?</label>
                <input type="text" name="Domestic_Dietary_Needs">

                <label>15. Any health condition relevant to your ability to work?</label>
                <textarea name="Domestic_Health_Conditions" rows="2"></textarea>
            </fieldset>

            <!-- STEP 5: ADMINISTRATIVE STAFF QUESTIONS -->
            <fieldset id="adminSection" class="hidden-section">
                <legend>Administrative Staff Details</legend>
                
                <label>1. Course studied *</label>
                <input type="text" name="Admin_Course_Studied">

                <label>2. Institution attended *</label>
                <input type="text" name="Admin_Institution">

                <label>3. Years of work experience *</label>
                <input type="number" name="Admin_Experience_Years">

                <label>4. Name of last employer *</label>
                <input type="text" name="Admin_Last_Employer">

                <label>5. Address/location of last employer *</label>
                <input type="text" name="Admin_Employer_Address">

                <label>6. Previous job title *</label>
                <input type="text" name="Admin_Previous_Title">

                <label>7. Major responsibilities in previous job *</label>
                <textarea name="Admin_Responsibilities" rows="3"></textarea>

                <label>8. Reason for leaving last employment *</label>
                <textarea name="Admin_Reason_Leaving" rows="2"></textarea>

                <label>9. Computer skills *</label>
                <input type="text" name="Admin_Computer_Skills">

                <label>10. Professional certifications (if any)</label>
                <input type="text" name="Admin_Certifications">

                <label>11. Last monthly salary *</label>
                <input type="text" name="Admin_Last_Salary">

                <label>12. Expected monthly salary *</label>
                <input type="text" name="Admin_Expected_Salary">

                <label>13. When can you resume work? *</label>
                <input type="text" name="Admin_Resumption_Date">

                <label>14. Are you willing to undergo background verification? *</label>
                <select name="Admin_Background_Verification">
                    <option value="">-- Select --</option>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </fieldset>

            <!-- STEP 6: DECLARATION -->
            <fieldset>
                <legend>Declaration & Submission</legend>
                <div class="checkbox-group">
                    <label><input type="checkbox" required> I confirm that the information provided is accurate.</label>
                    <label><input type="checkbox" required> I agree to follow workplace rules and reasonable instructions.</label>
                    <label><input type="checkbox" required> I understand that registration does not guarantee employment.</label>
                    <label><input type="checkbox" required> I consent to being contacted about suitable job opportunities.</label>
                </div>

                <button type="submit" class="submit-btn">SUBMIT APPLICATION</button>
            </fieldset>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
